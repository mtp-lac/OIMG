name: Windows Release

# Tag pushes keep the release behavior. Manual runs build the ref supplied in
# "ref" (defaults to the experimental expr/gjxl branch) and only upload
# artifacts, unless the ref itself is a vX.Y.Z tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build."
        required: false
        default: "expr/gjxl"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows ZIP, installer, and Store MSIX
    runs-on: windows-2025
    timeout-minutes: 120

    env:
      APP_NAME: OIMG
      DIST_DIR: ${{ github.workspace }}\oimg\dist\windows

    steps:
      - name: Resolve build ref
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCHED_REF: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $checkoutRef = "$env:INPUT_REF".Trim()
            if ([string]::IsNullOrWhiteSpace($checkoutRef)) {
              $checkoutRef = $env:DISPATCHED_REF
            }
          } else {
            $checkoutRef = $env:GITHUB_REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($checkoutRef)) {
            throw "Could not determine which Git ref to build."
          }

          # Treat refs that look like release tags as tagged builds.
          $tag = ""
          $version = ""
          if ($checkoutRef -match '^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$') {
            $tag = $checkoutRef
            $version = $checkoutRef.Substring(1)
          }

          "checkout_ref=$checkoutRef" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Checkout oimg
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}
          path: oimg
          fetch-depth: 0

      - name: Validate tag is on main
        if: github.ref_type == 'tag' && steps.release.outputs.tag != ''
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main
          $PSNativeCommandUseErrorActionPreference = $false
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag ${{ steps.release.outputs.tag }} must point to a commit reachable from origin/main."
          }

      - name: Resolve dependency refs
        id: deps
        shell: pwsh
        env:
          BUILD_REF: ${{ steps.release.outputs.checkout_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $buildRef = "$env:BUILD_REF".Trim()

          # expr/gjxl requires the experimental Slimg commit it pins; every
          # other ref keeps following Slimg main.
          if ($buildRef -match '(^|/)expr/gjxl$') {
            $slimgRef = "7e39c9353c2c0c493245a53ec7574e39b23a9ed4"
          } else {
            $slimgRef = "main"
          }

          "slimg_ref=$slimgRef" >> $env:GITHUB_OUTPUT

      # CI_REPO_TOKEN is optional: the sibling repositories are public, so the
      # default token can read them on a fork. Set the secret only when they
      # are private.
      - name: Checkout slimg
        uses: actions/checkout@v6
        with:
          repository: yunho-c/slimg
          ref: ${{ steps.deps.outputs.slimg_ref }}
          path: slimg
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
          submodules: recursive

      - name: Checkout tjdistler-iqa-fork
        uses: actions/checkout@v6
        with:
          repository: yunho-c/tjdistler-iqa-fork
          ref: perf/simd-gaussian-vertical
          path: tjdistler-iqa-fork
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout irondash
        uses: actions/checkout@v6
        with:
          repository: yunho-c/irondash
          ref: fix/macos-engine-context-race
          path: irondash
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Resolve build version
        id: version
        shell: pwsh
        working-directory: oimg
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*(\S+)' } | Select-Object -First 1
          if ($null -eq $line -or $line -notmatch '^version:\s*([^+]+)') {
            throw "Could not read version from pubspec.yaml"
          }

          $pubspecVersion = $Matches[1].Trim()
          if ($pubspecVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') {
            throw "pubspec.yaml version must be numeric, got: $pubspecVersion"
          }

          $releaseVersion = "$env:RELEASE_VERSION".Trim()
          if ([string]::IsNullOrWhiteSpace($releaseVersion)) {
            # Manual branch builds name artifacts from pubspec.yaml.
            $releaseVersion = $pubspecVersion
          } elseif ($releaseVersion -ne $pubspecVersion) {
            throw "Tag version ($releaseVersion) does not match pubspec.yaml ($pubspecVersion)"
          }

          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable-x86_64-pc-windows-msvc --force-non-host
          rustup target add x86_64-pc-windows-msvc --toolchain stable-x86_64-pc-windows-msvc

      - name: Install native build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nasm llvm innosetup -y --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Flutter dependencies
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get
          dart pub get --directory rust_builder/cargokit/build_tool

      - name: Run release checks
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          flutter analyze
          flutter test test/settings test/file_open_controller_test.dart test/file_open_channel_test.dart test/optimization
          $env:RUSTC_WRAPPER = ""
          $env:CARGO_BUILD_RUSTC_WRAPPER = ""
          cargo test --manifest-path rust/Cargo.toml

      - name: Build unsigned Windows app
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -ExecutionPolicy Bypass -File scripts/windows/build_windows.ps1 -Command build -Mode release

      - name: Package Windows ZIP
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null

          $releaseDir = "build\windows\x64\runner\Release"
          $exePath = Join-Path $releaseDir "oimg.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows executable not found: $exePath"
          }

          $zipPath = Join-Path $env:DIST_DIR "OIMG-${{ steps.version.outputs.version }}-windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath
          }

          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath $zipPath
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          Set-Content -Path "$zipPath.sha256" -Value "$hash  $(Split-Path -Leaf $zipPath)"

      - name: Package Windows installer
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -ExecutionPolicy Bypass -File scripts/windows/package_inno_installer.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputDir $env:DIST_DIR

      - name: Build Microsoft Store app
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -ExecutionPolicy Bypass -File scripts/windows/build_windows.ps1 -Command build -Mode release -Store

      - name: Package Store MSIX
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $msixVersion = "${{ steps.version.outputs.version }}.0"
          dart run msix:create --version $msixVersion

          $generatedMsix = Get-ChildItem "build\windows\x64\msix" -Filter "*.msix" | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $generatedMsix) {
            throw "Expected MSIX artifact not found in build\windows\x64\msix"
          }

          $msixPath = Join-Path $env:DIST_DIR "OIMG-${{ steps.version.outputs.version }}-windows-x64.msix"
          if (Test-Path $msixPath) {
            Remove-Item $msixPath
          }

          Move-Item -Path $generatedMsix.FullName -Destination $msixPath
          $hash = (Get-FileHash -Algorithm SHA256 $msixPath).Hash.ToLowerInvariant()
          Set-Content -Path "$msixPath.sha256" -Value "$hash  $(Split-Path -Leaf $msixPath)"

      - name: Verify Windows artifacts
        shell: pwsh
        working-directory: oimg
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build\windows\x64\runner\Release"
          $zipPath = Join-Path $env:DIST_DIR "OIMG-${{ steps.version.outputs.version }}-windows-x64.zip"
          $shaPath = "$zipPath.sha256"
          $setupPath = Join-Path $env:DIST_DIR "OIMG-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          $setupShaPath = "$setupPath.sha256"
          $msixPath = Join-Path $env:DIST_DIR "OIMG-${{ steps.version.outputs.version }}-windows-x64.msix"
          $msixShaPath = "$msixPath.sha256"

          foreach ($path in @((Join-Path $releaseDir "oimg.exe"), $zipPath, $shaPath, $setupPath, $setupShaPath, $msixPath, $msixShaPath)) {
            if (-not (Test-Path $path)) {
              throw "Expected artifact not found: $path"
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: OIMG-${{ steps.version.outputs.version }}-windows-x64
          path: |
            oimg/dist/windows/*.zip
            oimg/dist/windows/*.exe
            oimg/dist/windows/*.msix
            oimg/dist/windows/*.sha256
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag' && steps.release.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ steps.release.outputs.tag }}"
          $zipPath = Get-ChildItem $env:DIST_DIR -Filter "*.zip" | Sort-Object Name | Select-Object -Last 1
          $setupPath = Get-ChildItem $env:DIST_DIR -Filter "*.exe" | Sort-Object Name | Select-Object -Last 1
          $msixPath = Get-ChildItem $env:DIST_DIR -Filter "*.msix" | Sort-Object Name | Select-Object -Last 1
          $assetPaths = Get-ChildItem $env:DIST_DIR -Include "*.zip", "*.exe", "*.msix", "*.sha256" -Recurse | Sort-Object Name

          if ($null -eq $zipPath -or $null -eq $setupPath -or $null -eq $msixPath -or $assetPaths.Count -lt 6) {
            throw "Expected Windows release artifacts were not found in $env:DIST_DIR"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --draft `
              --title "OIMG $tag" `
              --notes "Windows release candidate for $tag."
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          gh release upload $tag @($assetPaths | ForEach-Object { $_.FullName }) `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
